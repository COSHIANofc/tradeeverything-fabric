plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
	splitEnvironmentSourceSets()
	mods {
		tradeeverything {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'tradeeverything-gametest'
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand version: inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	includeEmptyDirs = false
	inputs.property 'archivesName', project.base.archivesName
	from('LICENSE') { rename { "${it}_${inputs.properties.archivesName}" } }
}

publishing {
	publications { create('mavenJava', MavenPublication) { from components.java } }
}
